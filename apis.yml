name: Lagoa
description: >-
  Lagoa was a cloud-based 3D visualization, rendering, and CAD publishing
  platform built by TeamUp Technologies Inc., billed as the first web-based
  platform for photoreal 3D visualization and rendering. It let artists,
  designers, engineers, and architects import over 40 native CAD formats, build
  kinematic assemblies, produce photoreal renders in the browser via its
  MultiOptics interactive rendering engine, publish interactive 3D product
  configurators, and collaborate on scenes in real time — with no local hardware
  or installed software. Lagoa also ran a developer platform exposing server-side
  Platform APIs (geometry and image transcoding, asset management, thumbnailing,
  user authentication, versioning) alongside an Application Framework with
  Application, Collaboration, and Real-time Persistence APIs for embedding
  browser-based 3D into third-party apps. The company acquired browser CAD tool
  3DTin in September 2013. Surfaced as a portfolio company of 500-global and
  added to the API Evangelist network for enrichment. The company is defunct: the
  marketing site (home.lagoa.com), support and API documentation
  (support.lagoa.com) and application host all stopped resolving, the
  github.com/lagoa organization is empty, and lagoa.com is now a parked listing
  offered for sale on atom.com. No live developer, API, or documentation surface
  remains to harvest.
